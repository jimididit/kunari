# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kunari

before:
  hooks:
    - go mod tidy

builds:
  - id: kunari
    main: ./cmd/kunari
    binary: kunari
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jimididit/kunari/internal/cli.Version={{.Version}} -X github.com/jimididit/kunari/internal/cli.Commit={{.Commit}} -X github.com/jimididit/kunari/internal/cli.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

sboms:
  - id: archives
    artifacts: archive
  - id: source
    artifacts: source

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
