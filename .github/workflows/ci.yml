name: ci

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Self-test
        run: go run ./cmd/kunari self-test
      - name: Test
        run: go test ./...
      - name: Smoke (beacon + unprivileged sentinel)
        # Hub beacon e2e + unprivileged FS watch (inotify / win-rdc / fsevents).
        # Privileged tiers (fanotify, win-sacl-4663, eslogger+FDA) stay lab-only.
        shell: bash
        run: |
          go test ./internal/hub/ -count=1 -run 'TestHub|Beacon|SSE'
          go test ./internal/sensor/ -count=1 -run 'TestUnprivilegedSentinelTouchE2E|TestHardenPrivate|TestLoadConfigHardens|TestWriteExampleConfigPrivate'
      - name: Build
        run: go build -o bin/kunari ./cmd/kunari
