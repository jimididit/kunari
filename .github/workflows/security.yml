name: security

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -exclude-generated ./cmd/... ./internal/...


  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: semgrep
        run: semgrep scan --config p/golang --error --metrics=off

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Short fuzz
        run: |
          go test ./internal/sensor/ -run='^$' -fuzz=FuzzParseESLoggerLine -fuzztime=15s
          go test ./internal/sensor/ -run='^$' -fuzz=FuzzMatchAllowlist -fuzztime=10s
          go test ./internal/safepath/ -run='^$' -fuzz=FuzzClean -fuzztime=10s
          go test ./internal/event/ -run='^$' -fuzz=FuzzCanonicalPayload -fuzztime=10s
