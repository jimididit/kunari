name: security

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -exclude-generated ./cmd/... ./internal/...


  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: semgrep
        run: semgrep scan --config p/golang --error --metrics=off

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Short fuzz
        # Tolerate Go's known -fuzztime shutdown race ("context deadline exceeded"
        # with no crasher). See https://github.com/golang/go/issues/75804
        run: |
          set +e
          run_fuzz() {
            local label="$1"; shift
            local log
            log="$(mktemp)"
            for attempt in 1 2 3; do
              go test "$@" >"$log" 2>&1
              code=$?
              cat "$log"
              if [ "$code" -eq 0 ]; then
                return 0
              fi
              if grep -qE 'Failing input written to|fuzz: minimizing|panic:|seed corpus' "$log"; then
                echo "::error::${label}: real fuzz finding"
                return "$code"
              fi
              if grep -q 'context deadline exceeded' "$log" && grep -q 'fuzz: elapsed:' "$log"; then
                echo "::warning::${label}: benign fuzztime deadline race (attempt ${attempt}); retrying"
                continue
              fi
              echo "::error::${label}: unexpected fuzz failure"
              return "$code"
            done
            echo "::error::${label}: still failing after retries"
            return 1
          }
          run_fuzz ParseESLoggerLine ./internal/sensor/ -run='^$' -fuzz=FuzzParseESLoggerLine -fuzztime=15s || exit 1
          run_fuzz MatchAllowlist ./internal/sensor/ -run='^$' -fuzz=FuzzMatchAllowlist -fuzztime=10s || exit 1
          run_fuzz Clean ./internal/safepath/ -run='^$' -fuzz=FuzzClean -fuzztime=10s || exit 1
          run_fuzz CanonicalPayload ./internal/event/ -run='^$' -fuzz=FuzzCanonicalPayload -fuzztime=10s || exit 1
